<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>나의 고등학교 생활</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff8f2; --card:#ffffff; --ink:#3a3542; --sub:#8a8393; --line:#f3e8de;
  --main:#8b7cf6; --mainSoft:#f1eeff; --warn:#f0803c; --warnSoft:#fff0e4; --ok:#3fb28a; --okSoft:#e6f7f0;
  --pink:#ff8fab; --pinkSoft:#ffeef3; --yellow:#ffc94d; --yellowSoft:#fff7df; --sky:#5aa9f5; --skySoft:#e9f4ff;
  --r:22px; --shadow:0 4px 16px rgba(150,110,80,.07);
  --round:"Jua","Noto Sans KR",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;font-size:15px}
header{padding:calc(env(safe-area-inset-top) + 18px) 20px 6px;max-width:560px;margin:0 auto;display:flex;align-items:flex-start;gap:10px}
header .hd{flex:1;min-width:0}
.gear{flex:none;width:42px;height:42px;border-radius:14px;border:0;background:#fff;box-shadow:var(--shadow);color:var(--sub);display:grid;place-items:center}
.gear.on{background:var(--main);color:#fff}
.gear svg{width:22px;height:22px}
header h1{margin:0;font-family:var(--round);font-weight:400;font-size:25px;letter-spacing:-.3px}
header p{margin:4px 0 0;color:var(--sub);font-size:13px}
main{padding:10px 16px calc(env(safe-area-inset-bottom) + 96px);max-width:560px;margin:0 auto}
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);border-radius:22px 22px 0 0;box-shadow:0 -4px 18px rgba(150,110,80,.06);display:flex;padding:6px 6px calc(env(safe-area-inset-bottom) + 6px);z-index:5}
nav button{flex:1;border:0;background:none;padding:8px 0;font:inherit;font-size:12px;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:3px;border-radius:12px}
nav button svg{width:22px;height:22px}
nav button.on{color:var(--main);background:var(--mainSoft);font-weight:700}
nav button.on svg{transform:translateY(-1px) scale(1.08)}
nav button svg{transition:.15s}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px 17px;margin-bottom:12px;box-shadow:var(--shadow)}
.big,.dday,h2,.htitle{font-family:var(--round);font-weight:400!important}
.htitle{font-size:18px;margin:0 0 2px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.sec{font-family:var(--round);font-size:16px;color:var(--ink);margin:22px 4px 10px}
.dday{min-width:58px;text-align:center;font-weight:700;font-size:15px;padding:6px 8px;border-radius:10px;background:var(--mainSoft);color:var(--main)}
.dday.hot{background:var(--warnSoft);color:var(--warn)}
.dday.past{background:#f1f1f3;color:var(--sub)}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;background:#f3f0ea;color:#6b6358;margin-right:4px}
.title{font-weight:500;overflow:hidden;text-overflow:ellipsis}
.meta{font-size:12px;color:var(--sub);margin-top:3px}
.chk{width:28px;height:28px;border-radius:50%;border:2.5px solid #d9cfe9;background:#fff;flex:none;display:grid;place-items:center;padding:0}
.chk.done{background:var(--ok);border-color:var(--ok)}
.chk.done::after{content:"";width:8px;height:13px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.done-t{text-decoration:line-through;color:var(--sub)}
.fab{background:linear-gradient(135deg,#a594ff,#ff9ab5)!important;position:fixed;right:20px;bottom:calc(env(safe-area-inset-bottom) + 82px);width:56px;height:56px;border-radius:50%;border:0;background:var(--main);color:#fff;font-size:30px;box-shadow:0 6px 18px rgba(108,92,231,.35);z-index:6}
.empty{text-align:center;color:var(--sub);padding:30px 10px;font-size:14px;line-height:1.6}
.seg{display:flex;background:#f4ece4;border-radius:16px;padding:3px;margin-bottom:10px}
.seg button{flex:1;border:0;background:none;padding:8px;font:inherit;font-size:13px;border-radius:10px;color:var(--sub)}
.seg button.on{background:#fff;color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.big{font-size:30px;font-weight:700;color:var(--main)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.stats .card{margin:0}
.bar{height:8px;background:#f1ece5;border-radius:99px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--main);border-radius:99px}
.grade{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-weight:700;flex:none}
.g1{background:#e7f5ff;color:#1c7ed6}.g2{background:#e6fcf5;color:#0ca678}.g3{background:#fff9db;color:#e67700}.g4{background:#fff0f6;color:#d6336c}.g5{background:#f1f3f5;color:#495057}
.del{border:0;background:none;color:#b8b1a8;font-size:20px;padding:4px 6px}
/* sheet */
.dim{position:fixed;inset:0;background:rgba(30,25,40,.38);z-index:10;display:none;align-items:flex-end;justify-content:center}
.dim.show{display:flex}
.sheet{background:#fff;width:100%;max-width:560px;border-radius:28px 28px 0 0;padding:20px 18px calc(env(safe-area-inset-bottom) + 18px);max-height:88vh;overflow:auto;animation:up .2s ease}
@keyframes up{from{transform:translateY(40px);opacity:.5}}
.sheet h2{margin:0 0 14px;font-size:18px}
label{display:block;font-size:13px;color:var(--sub);margin:12px 0 5px}
input,select,textarea{width:100%;font:inherit;font-size:16px;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:#fdfcfa;color:var(--ink)}
textarea{min-height:80px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--mainSoft);border-color:var(--main)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btns{display:flex;gap:8px;margin-top:18px}
.btn{flex:1;border:0;border-radius:16px;padding:14px;font:inherit;font-weight:700;background:var(--main);color:#fff}
.btn.ghost{background:#f1ece5;color:var(--ink)}
.btn.red{background:#fff0f0;color:#e03131}
.hint{font-size:12px;color:var(--sub);margin-top:6px;line-height:1.5}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 12px;font:inherit;font-size:13px;color:var(--ink)}
.chips button.on{background:var(--main);border-color:var(--main);color:#fff}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 92px);transform:translateX(-50%);background:#2b2a33;color:#fff;padding:10px 16px;border-radius:99px;font-size:13px;opacity:0;transition:.25s;z-index:20;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
.dim.show ~ .toast{bottom:auto;top:calc(env(safe-area-inset-top) + 16px)}
.sync{font-size:12px;color:var(--sub)}
.logbtn{flex:none;border:0;border-radius:99px;padding:6px 12px;font:inherit;font-size:13px;font-weight:700;background:var(--main);color:#fff}
.vt{display:flex;justify-content:flex-end;gap:6px;margin:0 0 10px}
.vt button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 14px;font:inherit;font-size:13px;color:var(--sub)}
.vt button.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:700}
.calnav{border:0;background:#f3efe9;width:36px;height:36px;border-radius:10px;font-size:22px;line-height:1;color:var(--ink)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.wd{text-align:center;font-size:12px;color:var(--sub);padding:4px 0}
.wd.sun,.dc.sun .dn{color:#e03131}.wd.sat,.dc.sat .dn{color:#1c7ed6}
.dc{min-height:64px;border:0;background:none;border-radius:10px;padding:3px 2px;display:flex;flex-direction:column;align-items:stretch;gap:2px;font:inherit;text-align:left;overflow:hidden}
.dc.out{opacity:.35}
.dc .dn{font-size:12px;text-align:center;width:22px;height:22px;line-height:22px;border-radius:50%;margin:0 auto}
.dc.today .dn{background:var(--main);color:#fff!important;font-weight:700}
.dc.sel{background:var(--mainSoft);outline:1.5px solid var(--main)}
.ev{display:block;font-size:10px;line-height:1.35;padding:0 3px;border-radius:4px;background:var(--mainSoft);color:var(--main);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.evh{background:var(--warnSoft);color:var(--warn)}.ev.evd{background:#f1f1f3;color:#9a96a3;text-decoration:line-through}
.evm{font-size:10px;color:var(--sub);text-align:center}
.dots{display:flex;justify-content:center;gap:3px;margin-top:auto}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%}
.dot.dt{background:var(--main)}.dot.ds{background:var(--ok)}.dot.da{background:var(--warn)}
.legend{display:flex;gap:14px;justify-content:center;font-size:12px;color:var(--sub);margin-top:10px}
.legend .dot{margin-right:4px;vertical-align:middle}
.hero{border-radius:26px;padding:20px 20px 18px;background:linear-gradient(135deg,#b9a9ff 0%,#ffb3c8 100%);color:#fff;box-shadow:0 8px 22px rgba(160,120,220,.25);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-30px;top:-30px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.18)}
.hero-k{font-size:12px;opacity:.9;letter-spacing:1px}
.hero-t{font-family:var(--round);font-size:26px;margin-top:2px}
.hero-s{font-size:13px;opacity:.95;margin-top:4px}
.hero-c{margin-top:14px;font-size:13px;background:rgba(255,255,255,.25);display:inline-block;padding:6px 12px;border-radius:99px}
.pill{border:0;border-radius:99px;padding:6px 13px;font:inherit;font-size:13px;font-weight:700;background:var(--mainSoft);color:var(--main)}
.pill.ghost{background:none;color:var(--sub);font-weight:500}
.soft-y{background:var(--yellowSoft);border-color:#fbe8b5}.soft-o{background:var(--warnSoft);border-color:#fbd9c0}
.soft-p{background:var(--pinkSoft);border-color:#ffd6e0}.soft-g{background:var(--okSoft);border-color:#c9eedf}.soft-v{background:var(--mainSoft);border-color:#e1dbff}
.goal .gico{font-size:24px;width:34px;text-align:center}
.goal .gnum{font-family:var(--round);font-weight:400;font-size:20px;color:var(--main)}
.goal .gnum small{font-size:13px;color:var(--sub)}
.goal.done{background:var(--okSoft);border-color:#c9eedf}.goal.done .gnum{color:var(--ok)}
.bar.soft{height:10px;background:#f4eee8}
.bar.soft i{background:linear-gradient(90deg,#b9a9ff,#8b7cf6)}
.plus1{flex:none;border:0;width:44px;height:36px;border-radius:12px;background:var(--yellow);color:#5a4300;font:inherit;font-weight:700}
.seg.big2 button{font-size:15px;padding:10px}
.btn.wide{width:100%;margin-bottom:12px;background:linear-gradient(90deg,#ff9ab5,#ff8fab)}
.btn.okb{background:var(--ok)}
.deck .dico{font-size:26px}
.dbtns{display:flex;gap:6px;margin-top:12px}
.dbtns button{flex:1;border:0;border-radius:12px;padding:10px 4px;font:inherit;font-size:13px;font-weight:700;background:#f6f0ea;color:var(--ink)}
.dbtns button:first-child{background:var(--pink);color:#fff}
.dbtns button:disabled{opacity:.4}
.wlist{max-height:38vh;overflow:auto;border:1px solid var(--line);border-radius:14px;padding:4px 10px}
.wr{padding:8px 0;border-bottom:1px dashed var(--line)}.wr:last-child{border:0}
.ww{min-width:90px;font-size:15px}.wm{font-size:14px;color:#5a5664}
.lv{font-size:8px;color:var(--pink);letter-spacing:1px}
.fcard{width:100%;min-height:230px;border:0;border-radius:24px;background:linear-gradient(160deg,#fff,#fff3f6);box-shadow:0 6px 20px rgba(255,143,171,.22);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;font:inherit;padding:20px}
.fw{font-family:var(--round);font-size:36px;color:var(--ink);word-break:break-word}
.fm{font-size:15px;color:var(--sub)}
.fm.show{font-size:22px;color:var(--pink);font-weight:700}
.qword{font-family:var(--round);font-size:34px;text-align:center;margin:26px 0 20px}
.qopts{display:grid;gap:10px}
.qopt{border:1.5px solid var(--line);background:#fff;border-radius:16px;padding:14px;font:inherit;font-size:16px;text-align:left}
.qopt.right{background:var(--okSoft);border-color:var(--ok);color:var(--ok);font-weight:700}
.qopt.wrong{background:#fff0f0;border-color:#ff8787;color:#e03131}
.qres{text-align:center;padding:16px 0}
.ggrid{max-height:40vh;overflow:auto}
.gg{padding:6px 0;border-bottom:1px dashed var(--line)}.gg select{width:90px;padding:8px}
.calbtn{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--sub);background:#f6f2ec}
.calbtn.on{color:var(--ok);background:var(--okSoft)}
.steps{margin:8px 0 0;padding-left:18px;font-size:13px;line-height:1.7;color:#5a5664}
</style>
</head>
<body>
<header>
  <div class="hd"><h1 id="hello">나의 고등학교 생활</h1><p id="today"></p></div>
  <button class="gear" id="gear" aria-label="설정"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
</header>
<main id="view"></main>
<button class="fab" id="fab" aria-label="추가">+</button>
<nav id="nav">
  <button data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>홈</button>
  <button data-tab="tasks"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="17" rx="4"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>일정</button>
  <button data-tab="study"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 5.5C4.5 4 8 4 12 6c4-2 7.5-2 10-.5V19c-2.5-1.5-6-1.5-10 .5-4-2-7.5-2-10-.5z"/><path d="M12 6v13.5"/></svg>공부</button>
  <button data-tab="grades"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V11M10 20V5M16 20v-6M21 20H3"/></svg>성적</button>
  <button data-tab="acts"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.4 6.8 19.1l1-5.8L3.5 9.2l5.9-.9z"/></svg>활동</button>
</nav>
<div class="dim" id="dim"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
const DEFAULT_LISTS={
  subjects:["국어","수학","영어","한국사","통합사회","통합과학","과학탐구실험","정보","체육","음악","미술","기술·가정","제2외국어","기타"],
  taskTypes:["수행평가","지필고사","과제","준비물","학원 숙제","기타"],
  actTypes:["동아리","봉사","독서","탐구·발표","대회·수상","진로","기타"]
};
const LIST_INFO={subjects:"과목",taskTypes:"일정 종류",actTypes:"활동 종류"};
const L=k=>(S.lists&&Array.isArray(S.lists[k])&&S.lists[k].length)?S.lists[k]:DEFAULT_LISTS[k];
const UNITS=["단원","페이지","강","챕터","회차"];
const BLANK=()=>({name:"",tasks:[],grades:[],acts:[],studies:[],decks:[],vocabLog:{},weekProg:{},goals:{career:"",dream:"",semAvg:{},subj:{},weekly:[]},lists:null,studyAlarm:{on:false,time:"21:00"},updatedAt:0});
function normalize(){const b=BLANK();for(const k in b)if(S[k]===undefined||S[k]===null&&k!=="lists")S[k]=b[k];S.goals=Object.assign(b.goals,S.goals||{});}
const SEMS=["1-1","1-2","2-1","2-2","3-1","3-2"];
const KEY="hs-life-v1";

let S=BLANK();
let taskView="list", calMonth=todayStr().slice(0,7), selDay=todayStr();
let tab="home", studySub="pre", taskFilter="todo", gradeSem="all", actFilter="all", studyFilter="ing";
let cloud=null, syncState="이 폰에만 저장 중";
/* ---------- 안드로이드 앱(Capacitor) 알람 ---------- */
const APP=!!(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform());
const LN=APP&&Capacitor.Plugins?Capacitor.Plugins.LocalNotifications:null;
let alarmPerm="unknown", exactPerm="unknown";
function hashId(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))|0;return Math.abs(h)%400000000;}
let schedTimer=null;
function scheduleSoon(){if(!LN)return;clearTimeout(schedTimer);schedTimer=setTimeout(scheduleAll,500);}
async function scheduleAll(){
  if(!LN)return;
  try{
    const p=await LN.getPending();
    if(p.notifications&&p.notifications.length)await LN.cancel({notifications:p.notifications.map(n=>({id:n.id}))});
    const now=Date.now(),list=[];
    S.tasks.filter(t=>!t.done).forEach(t=>{
      const base=hashId(t.id)*2;
      const eve=new Date(t.date+"T20:00:00");eve.setDate(eve.getDate()-1);
      const morn=new Date(t.date+"T07:00:00");
      if(eve.getTime()>now)list.push({id:base,channelId:"due",title:"내일 마감 · "+t.title,body:`${t.subject} ${t.type} — 오늘 밤에 한 번 더 확인해요`,schedule:{at:eve,allowWhileIdle:true}});
      if(morn.getTime()>now)list.push({id:base+1,channelId:"due",title:"오늘 마감 · "+t.title,body:`${t.subject} ${t.type} — 잊지 말고 챙기기!`,schedule:{at:morn,allowWhileIdle:true}});
    });
    if(S.studyAlarm&&S.studyAlarm.on&&S.studies.some(x=>sDone(x)<x.total)){
      const [hh,mm]=(S.studyAlarm.time||"21:00").split(":").map(Number);
      list.push({id:900000001,channelId:"due",title:"오늘 선행 공부 기록했나요? 📚",body:"공부한 만큼 + 기록 버튼으로 남겨 두세요",schedule:{on:{hour:hh,minute:mm},allowWhileIdle:true}});
    }
    if(list.length)await LN.schedule({notifications:list});
  }catch(e){console.log("schedule error",e);}
}
async function initAlarms(){
  if(!LN)return;
  try{await LN.createChannel({id:"due",name:"마감 알림",description:"수행평가·시험 마감 알림",importance:5,visibility:1,vibration:true});}catch(e){}
  try{let s=await LN.checkPermissions();if(s.display!=="granted")s=await LN.requestPermissions();alarmPerm=s.display;}catch(e){}
  try{const x=await LN.checkExactNotificationSetting();exactPerm=x.exact_alarm;}catch(e){}
  scheduleAll();if(tab==="more")render();
}

/* ---------- storage ---------- */
function loadLocal(){try{const t=localStorage.getItem(KEY);if(t){const d=JSON.parse(t);if(d&&d.tasks){S=Object.assign(BLANK(),d);normalize();}}}catch(e){}}
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
let pushTimer=null;
function save(){S.updatedAt=Date.now();saveLocal();scheduleSoon();if(cloud){clearTimeout(pushTimer);pushTimer=setTimeout(pushCloud,800);}render();}
async function pushCloud(){try{await cloud.set(JSON.parse(JSON.stringify(S)));syncState="계정에 자동 저장됨";}catch(e){syncState="계정 저장 실패 · 폰에는 저장됨";}if(tab==="more")render();}
async function initCloud(){
  try{
    if(!window.claude||!claude.use)return;
    const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
    if(!db||!user)return;
    const id=await user.id(); if(!id)return;
    const ref=db.collection("data/users/"+id).doc("state");
    let snap=null;
    await Promise.race([ref.get().then(s=>snap=s),new Promise(r=>setTimeout(r,10000))]);
    let remote=null;
    if(snap){remote=typeof snap.data==="function"?snap.data():(snap.data!==undefined?snap.data:snap);}
    cloud=ref;
    if(remote&&remote.tasks&&(remote.updatedAt||0)>(S.updatedAt||0)){S=Object.assign(BLANK(),remote);normalize();saveLocal();}
    else if(S.updatedAt){await pushCloud();}
    syncState="계정에 자동 저장됨";render();
  }catch(e){}
}

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function todayStr(){const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10);}
function ddays(date){const a=new Date(todayStr()+"T00:00:00"),b=new Date(date+"T00:00:00");return Math.round((b-a)/86400000);}
function ddayLabel(n){return n===0?"D-day":n>0?"D-"+n:"D+"+(-n);}
function fmtDate(s){if(!s)return"";const d=new Date(s+"T00:00:00");return (d.getMonth()+1)+"월 "+d.getDate()+"일 ("+"일월화수목금토"[d.getDay()]+")";}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),1800);}
function chips(list,cur,name){return `<div class="chips" data-chips="${name}">${list.map(v=>`<button type="button" class="${v===cur?"on":""}" data-v="${esc(v)}">${esc(v)}</button>`).join("")}</div>`;}
function subjOptions(cur){const l=L("subjects").slice();if(cur&&!l.includes(cur))l.unshift(cur);return l.map(s=>`<option ${s===cur?"selected":""}>${esc(s)}</option>`).join("");}
function withCur(list,cur){return cur&&!list.includes(cur)?[cur,...list]:list;}
/* 5등급 상대평가: 누적 10/34/66/90/100% */
function rankToGrade(rank,total){if(!rank||!total)return null;const p=rank/total*100;return p<=10?1:p<=34?2:p<=66?3:p<=90?4:5;}
/* 구글 캘린더 종일 일정 링크 */
function gcalUrl(x){
  const d=x.date.replace(/-/g,"");const n=new Date(x.date+"T00:00:00");n.setDate(n.getDate()+1);
  const e=n.getFullYear()+String(n.getMonth()+1).padStart(2,"0")+String(n.getDate()).padStart(2,"0");
  const p=new URLSearchParams({action:"TEMPLATE",text:`[${x.subject} ${x.type}] ${x.title}`,dates:`${d}/${e}`,details:(x.memo?x.memo+"\n\n":"")+"나의 고등학교 생활 앱에서 추가한 일정"});
  return "https://calendar.google.com/calendar/render?"+p.toString();
}

  return `<div class="card row" data-edit-task="${x.id}">
      <button class="chk ${x.done?"done":""}" data-toggle="${x.id}" aria-label="완료"></button>

        <div class="title ${x.done?"done-t":""}">${esc(x.title)}</div>
        <div class="meta"><span class="tag">${esc(x.subject)}</span><span class="tag">${esc(x.type)}</span>${fmtDate(x.date)}</div>
      </div>
      ${x.done||APP?"":`<a class="calbtn ${x.cal?"on":""}" href="${gcalUrl(x)}" target="_blank" rel="noopener" data-cal="${x.id}" aria-label="캘린더에 추가">${CAL_SVG}</a>`}

function ymd(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function dayItems(date){
  const tasks=S.tasks.filter(x=>x.date===date).sort((a,b)=>(a.done?1:0)-(b.done?1:0));
  const logs=[];S.studies.forEach(st=>(st.logs||[]).forEach(l=>{if(l.date===date)logs.push({st,l});}));
  const acts=S.acts.filter(a=>a.date===date);
  return {tasks,logs,acts};
}
function vCal(){
  const [Y,M]=calMonth.split("-").map(Number);
  const first=new Date(Y,M-1,1), start=new Date(first);start.setDate(1-first.getDay());
  const today=todayStr();
  let h=`<div class="card" style="padding:12px 10px">
    <div class="row" style="justify-content:space-between;margin-bottom:8px">
      <button class="calnav" data-mnav="-1" aria-label="이전 달">‹</button>
      <div style="font-weight:700;font-size:17px">${Y}년 ${M}월</div>
      <button class="calnav" data-mnav="1" aria-label="다음 달">›</button>
    </div>
    <div class="cal">${"일월화수목금토".split("").map((w,i)=>`<div class="wd ${i===0?"sun":i===6?"sat":""}">${w}</div>`).join("")}`;
  for(let i=0;i<42;i++){
    const d=new Date(start);d.setDate(start.getDate()+i);
    if(i>=35&&d.getMonth()!==M-1)break;
    const ds=ymd(d),it=dayItems(ds),out=d.getMonth()!==M-1;
    const tl=it.tasks.slice(0,2).map(x=>`<span class="ev ${x.done?"evd":ddays(x.date)<=3&&ddays(x.date)>=0?"evh":""}">${esc(x.title)}</span>`).join("");

    const dots=(it.logs.length?`<i class="dot ds"></i>`:"")+(it.acts.length?`<i class="dot da"></i>`:"");
    h+=`<button class="dc ${out?"out":""} ${ds===today?"today":""} ${ds===selDay?"sel":""} ${d.getDay()===0?"sun":d.getDay()===6?"sat":""}" data-day="${ds}">
      <span class="dn">${d.getDate()}</span>${tl}${more}${dots?`<span class="dots">${dots}</span>`:""}</button>`;
  }
  h+=`</div>
    <div class="legend"><span><i class="dot dt"></i>일정</span><span><i class="dot ds"></i>선행 공부</span><span><i class="dot da"></i>활동</span></div>

/* ---------- 선행학습 ---------- */
function sDone(st){return (st.logs||[]).reduce((a,l)=>a+(Number(l.amount)||0),0);}
function sPace(st){
  if(!st.start||!st.target||!st.total)return null;
  const a=new Date(st.start+"T00:00:00"),b=new Date(st.target+"T00:00:00"),t=new Date(todayStr()+"T00:00:00");
  const span=(b-a)/86400000; if(span<=0)return null;
  const el=Math.min(Math.max((t-a)/86400000,0),span);
  const expect=st.total*el/span, done=sDone(st), diff=done-expect;
  const left=Math.max(st.total-done,0), daysLeft=Math.max(Math.round((b-t)/86400000),0);
  const perWeek=daysLeft>0?left/daysLeft*7:left;
  return {expect,diff,daysLeft,perWeek,left};
}
function vStudy(){
  const ing=S.studies.filter(x=>sDone(x)<x.total), fin=S.studies.filter(x=>sDone(x)>=x.total);
  const list=studyFilter==="ing"?ing:fin;
  const week=new Date(todayStr()+"T00:00:00");week.setDate(week.getDate()-6);const wk=week.toISOString().slice(0,10);
  const days=new Set();S.studies.forEach(x=>(x.logs||[]).forEach(l=>{if(l.date>=wk)days.add(l.date);}));
  let h=`<div class="stats">
    <div class="card"><div class="meta">진행 중인 선행</div><div class="big">${ing.length}<span style="font-size:15px;color:var(--sub)"> 개</span></div></div>
    <div class="card"><div class="meta">최근 7일 공부한 날</div><div class="big">${days.size}<span style="font-size:15px;color:var(--sub)"> 일</span></div></div>
  </div>
  <div class="seg" data-seg="study"><button class="${studyFilter==="ing"?"on":""}" data-v="ing">진행 중 ${ing.length}</button><button class="${studyFilter==="fin"?"on":""}" data-v="fin">완료 ${fin.length}</button></div>`;
  if(!list.length)h+=`<div class="empty">${studyFilter==="ing"?"선행 중인 교재나 인강을 등록해 보세요.<br>예: 수학 · 공통수학1 개념원리 · 12단원<br>아래 <b>+</b> 버튼으로 추가해요.":"아직 끝낸 선행이 없어요. 화이팅!"}</div>`;
  list.forEach(st=>{
    const d=sDone(st),pct=Math.min(100,d/st.total*100),pc=sPace(st);
    let pace="";
    if(d>=st.total)pace=`<span class="tag" style="background:var(--okSoft);color:var(--ok)">완료 🎉</span>`;
    else if(pc){const df=Math.round(pc.diff*10)/10;
      pace=df>=0.5?`<span class="tag" style="background:var(--okSoft);color:var(--ok)">계획보다 ${df}${esc(st.unit)} 앞섬</span>`
        :df<=-0.5?`<span class="tag" style="background:var(--warnSoft);color:var(--warn)">계획보다 ${-df}${esc(st.unit)} 늦음</span>`
        :`<span class="tag" style="background:var(--mainSoft);color:var(--main)">계획대로 진행 중</span>`;
      pace+=`<span class="meta" style="display:block;margin-top:6px">목표 ${fmtDate(st.target)}까지 ${pc.daysLeft}일 · 일주일에 약 ${Math.ceil(pc.perWeek*10)/10}${esc(st.unit)}씩</span>`;}
    const last=(st.logs||[]).slice().sort((a,b)=>b.date.localeCompare(a.date))[0];
    h+=`<div class="card" data-edit-study="${st.id}">
      <div class="row"><span class="tag">${esc(st.subject)}</span><div class="grow title">${esc(st.title)}</div><button class="logbtn" data-log="${st.id}">+ 기록</button></div>
      <div class="row" style="margin-top:10px"><div class="grow"><div class="bar"><i style="width:${pct}%"></i></div></div><b style="font-size:13px">${d}/${st.total}${esc(st.unit)}</b></div>
      <div style="margin-top:8px">${pace}</div>
      ${last?`<div class="meta" style="margin-top:6px">최근 기록: ${fmtDate(last.date)} · ${last.amount}${esc(st.unit)}${last.memo?" · "+esc(last.memo):""}</div>`:""}
    </div>`;
  });
  return h;
}

        const sync=()=>$("#sheet").querySelectorAll("[data-i]").forEach(inp=>items[+inp.dataset.i].val=inp.value);
        $("#sheet").querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{sync();items.splice(+b.dataset.rm,1);draw();});
        const add=()=>{sync();const v=$("#newItem").value.trim();if(!v)return;if(items.some(x=>x.val.trim()===v)){toast("이미 있는 이름이에요");return;}items.push({orig:null,val:v});draw();setTimeout(()=>$("#newItem").focus(),50);};
        $("#addItem").onclick=add;$("#newItem").addEventListener("keydown",e=>{if(e.key==="Enter")add();});
        $("#eCancel").onclick=closeSheet;
        $("#eReset").onclick=()=>{if(!S.lists)S.lists={};delete S.lists[key];closeSheet();save();toast("기본 목록으로 되돌렸어요");};
        $("#eOk").onclick=()=>{
          sync();
          const out=[],seen=new Set();
          items.forEach(it=>{const v=it.val.trim();if(v&&!seen.has(v)){seen.add(v);out.push(v);}});
          if(!out.length){toast("하나 이상은 있어야 해요");return;}
          items.forEach(it=>{const v=it.val.trim();if(it.orig&&v&&v!==it.orig){
            if(key==="subjects"){[S.tasks,S.grades,S.studies].forEach(arr=>arr.forEach(r=>{if(r.subject===it.orig)r.subject=v;}));}
            if(key==="taskTypes")S.tasks.forEach(r=>{if(r.type===it.orig)r.type=v;});
            if(key==="actTypes"){S.acts.forEach(r=>{if(r.type===it.orig)r.type=v;});if(actFilter===it.orig)actFilter=v;}
          }});
          if(!S.lists)S.lists={};S.lists[key]=out;closeSheet();save();toast("저장했어요");
        };
      });
  };
  draw();
}

function weekStart(ds){const d=new Date((ds||todayStr())+"T00:00:00");const w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return ymd(d);}
function inThisWeek(ds){if(!ds)return false;const a=weekStart();const e=new Date(a+"T00:00:00");e.setDate(e.getDate()+7);return ds>=a&&ds<ymd(e);}
const CHEERS=["작은 하루가 모여 큰 변화가 돼요 🌱","오늘 한 걸음이면 충분해요 👣","꾸준함이 최고의 재능이에요 ✨","천천히 가도 멈추지만 않으면 돼요 🐢","어제의 나보다 조금만 더! 💪","잘하고 있어요, 정말로요 🌷","쉬는 것도 공부의 일부예요 ☕"];

function goalProg(g){
  const ws=weekStart();
  if(g.kind==="studyDays"){const days=new Set();S.studies.forEach(st=>(st.logs||[]).forEach(l=>{if(inThisWeek(l.date))days.add(l.date);}));return days.size;}
  if(g.kind==="vocab"){let n=0;Object.entries(S.vocabLog||{}).forEach(([d,c])=>{if(inThisWeek(d))n+=c;});return n;}
  if(g.kind==="taskDone")return S.tasks.filter(t=>t.done&&inThisWeek(t.doneAt)).length;
  return (S.weekProg||{})[ws+"|"+g.id]||0;
}

  g.weekly.forEach(w=>{const p=goalProg(w),pct=Math.min(100,p/w.target*100),ok=p>=w.target,k=GOAL_KINDS[w.kind];
    h+=`<div class="card goal ${ok?"done":""}" data-goal="${w.id}"><div class="row"><span class="gico">${ok?"🎉":k.ico}</span><div class="grow"><div class="title">${esc(w.title)}</div>
      <div class="bar soft"><i style="width:${pct}%"></i></div></div><b class="gnum">${p}<small>/${w.target}</small></b>${w.kind==="manual"?`<button class="plus1" data-plus="${w.id}">+1</button>`:""}</div></div>`;});
  // upcoming tasks
  const up=S.tasks.filter(t=>!t.done&&ddays(t.date)>=-0).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,3);
  const over=S.tasks.filter(t=>!t.done&&ddays(t.date)<0).length;
  h+=`<div class="row" style="margin:20px 4px 10px"><div class="grow sec" style="margin:0">다가오는 일정</div><button class="pill ghost" data-go="tasks">전체 보기</button></div>`;
  if(over)h+=`<div class="card soft-o" data-go="tasks"><div class="title">⏰ 마감이 지난 일정이 ${over}개 있어요</div><div class="meta">끝냈다면 체크해 주세요</div></div>`;
  if(!up.length)h+=`<div class="card"><div class="meta" style="margin:0">예정된 일정이 없어요. 여유로운 한 주! 🍃</div></div>`;
  up.forEach(x=>{h+=taskCard(x);});
  // vocab
  const due=S.decks.reduce((a,d)=>a+d.words.filter(isDue).length,0), total=S.decks.reduce((a,d)=>a+d.words.length,0);
  const todayCnt=(S.vocabLog||{})[today]||0;
  h+=`<div class="sec">오늘의 단어</div>`;
  h+=total?`<div class="card soft-p row"><div class="grow"><div class="title">🔤 복습할 단어 ${due}개</div><div class="meta">오늘 ${todayCnt}개 복습했어요 · 전체 ${total}개</div></div>${due?`<button class="btn" style="flex:none;padding:10px 16px" data-act="review-all">시작</button>`:`<span class="tag" style="background:var(--okSoft);color:var(--ok)">오늘 끝! 🎉</span>`}</div>`
    :`<div class="card soft-p" data-act="go-voc"><div class="title">🔤 단어장을 만들어 보세요</div><div class="meta">공부 탭 → 단어장에서 영어 단어를 넣고 외울 수 있어요</div></div>`;
  // study summary
  const ing=S.studies.filter(x=>sDone(x)<x.total);
  if(ing.length){h+=`<div class="sec">선행 진도</div><div class="card">`;
    ing.slice(0,4).forEach((st,i)=>{const pct=Math.min(100,sDone(st)/st.total*100);h+=`<div style="${i?"margin-top:12px":""}" data-edit-study="${st.id}"><div class="row"><span class="grow" style="font-size:14px">${esc(st.title)}</span><b style="font-size:13px">${Math.round(pct)}%</b></div><div class="bar soft"><i style="width:${pct}%;background:var(--ok)"></i></div></div>`;});
    h+=`</div>`;}
  return h;
}

const BOX_DAYS=[0,1,2,4,7,15];

function addDays(ds,n){const d=new Date(ds+"T00:00:00");d.setDate(d.getDate()+n);return ymd(d);}
function vocabCount(n){S.vocabLog=S.vocabLog||{};const t=todayStr();S.vocabLog[t]=(S.vocabLog[t]||0)+n;}
function vVocab(){
  const total=S.decks.reduce((a,d)=>a+d.words.length,0), mem=S.decks.reduce((a,d)=>a+d.words.filter(w=>w.box>=4).length,0);

  S.decks.forEach(d=>{const n=d.words.length,m=d.words.filter(w=>w.box>=4).length,du=d.words.filter(isDue).length,pct=n?m/n*100:0;
    h+=`<div class="card deck" data-deck="${d.id}"><div class="row"><span class="dico">📒</span><div class="grow"><div class="title">${esc(d.name)}</div><div class="meta">단어 ${n}개 · 외움 ${m}개${du?` · <b style="color:var(--pink)">복습 ${du}개</b>`:""}</div></div></div>
      <div class="bar soft"><i style="width:${pct}%;background:var(--pink)"></i></div>
      <div class="dbtns"><button data-review="${d.id}" ${n?"":"disabled"}>카드 외우기</button><button data-quiz="${d.id}" ${n>=4?"":"disabled"}>퀴즈</button><button data-words="${d.id}">단어 관리</button></div></div>`;});

function deckForm(id){

function parseWords(txt){
  const out=[];txt.split(/\r?\n/).forEach(line=>{line=line.trim();if(!line)return;
    let m=line.split("\t");if(m.length<2)m=line.split(/\s+[-–:=]\s+|\s*[:=]\s*|\s*,\s*/);
    if(m.length<2){const k=line.match(/^([A-Za-z][A-Za-z' .\-]*?)\s+([^A-Za-z].*)$/);if(k)m=[k[1],k[2]];}
    if(m.length>=2&&m[0].trim()&&m[1].trim())out.push({w:m[0].trim(),m:m.slice(1).join(", ").trim()});});
  return out;
}

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function review(deckId){
  let pool=[];S.decks.filter(d=>!deckId||d.id===deckId).forEach(d=>d.words.forEach(w=>pool.push(w)));
  let cards=pool.filter(isDue);
  if(!cards.length&&deckId){cards=pool.slice();toast("복습할 단어가 없어서 전체를 한 번 볼게요");}
  if(!cards.length){toast("오늘 복습할 단어가 없어요 🎉");return;}
  cards=shuffle(cards).slice(0,30);
  let i=0,known=0,flipped=false;const again=[];
  const draw=()=>{
    if(i>=cards.length){
      if(again.length){cards=shuffle(again.splice(0));i=0;}
      else{closeSheet();save();toast(`복습 끝! ${known}개 기억했어요 👏`);return;}
    }
    const w=cards[i];flipped=false;
    openSheet(`<div class="row"><h2 class="grow" style="margin:0">카드 외우기</h2><span class="meta" style="margin:0">${i+1} / ${cards.length}</span></div>
      <div class="bar soft" style="margin:10px 0 16px"><i style="width:${i/cards.length*100}%;background:var(--pink)"></i></div>
      <button class="fcard" id="fc"><div class="fw">${esc(w.w)}</div><div class="fm" id="fm">눌러서 뜻 보기 👆</div></button>
      <div class="btns" id="fbt" style="visibility:hidden"><button class="btn red" id="fNo">😵 몰라요</button><button class="btn okb" id="fYes">😊 알아요</button></div>
      <div class="btns"><button class="btn ghost" id="fEnd">그만하기</button></div>`,()=>{
        $("#fc").onclick=()=>{if(flipped)return;flipped=true;$("#fm").textContent=w.m;$("#fm").classList.add("show");$("#fbt").style.visibility="visible";};
        $("#fYes").onclick=()=>{w.box=Math.min((w.box||0)+1,5);w.due=addDays(todayStr(),BOX_DAYS[w.box]);w.right=(w.right||0)+1;known++;vocabCount(1);i++;draw();};
        $("#fNo").onclick=()=>{w.box=0;w.due=todayStr();w.wrong=(w.wrong||0)+1;vocabCount(1);again.push(w);i++;draw();};
        $("#fEnd").onclick=()=>{closeSheet();save();};
      });
  };
  draw();
}
function quiz(deckId){
  const d=S.decks.find(x=>x.id===deckId);if(!d||d.words.length<4)return;
  const qs=shuffle(d.words.slice()).slice(0,10);let i=0,score=0;const wrong=[];
  const draw=()=>{
    if(i>=qs.length){save();openSheet(`<h2>퀴즈 결과</h2><div class="qres"><div class="big" style="font-size:44px;color:var(--main)">${score} / ${qs.length}</div>
      <div class="meta" style="font-size:15px;margin-top:6px">${score===qs.length?"완벽해요! 🏆":score>=qs.length*.7?"아주 잘했어요! 👏":"틀린 단어는 복습에 넣어 뒀어요 💪"}</div></div>
      ${wrong.length?`<label>다시 볼 단어</label>${wrong.map(w=>`<div class="row wr"><b class="ww">${esc(w.w)}</b><span class="grow wm">${esc(w.m)}</span></div>`).join("")}`:""}
      <div class="btns"><button class="btn ghost" id="qAgain">다시 풀기</button><button class="btn" id="qEnd">닫기</button></div>`,()=>{$("#qAgain").onclick=()=>quiz(deckId);$("#qEnd").onclick=()=>{closeSheet();render();};});return;}
    const w=qs[i];const others=shuffle(d.words.filter(x=>x.id!==w.id&&x.m!==w.m)).slice(0,3).map(x=>x.m);
    const opts=shuffle([w.m,...others]);
    openSheet(`<div class="row"><h2 class="grow" style="margin:0">퀴즈</h2><span class="meta" style="margin:0">${i+1} / ${qs.length} · ${score}점</span></div>
      <div class="qword">${esc(w.w)}</div>
      <div class="qopts">${opts.map((o,k)=>`<button class="qopt" data-k="${k}">${esc(o)}</button>`).join("")}</div>`,()=>{
        $("#sheet").querySelectorAll(".qopt").forEach(b=>b.onclick=()=>{
          const ok=opts[+b.dataset.k]===w.m;
          $("#sheet").querySelectorAll(".qopt").forEach(x=>{x.disabled=true;if(opts[+x.dataset.k]===w.m)x.classList.add("right");});
          if(ok){score++;w.right=(w.right||0)+1;}else{b.classList.add("wrong");w.box=0;w.due=todayStr();w.wrong=(w.wrong||0)+1;wrong.push(w);}
          vocabCount(1);setTimeout(()=>{i++;draw();},ok?550:1100);
        });
      });
  };
  draw();
}

    <div class="btns">${delBtn(id)}<button class="btn ghost" id="fCancel">취소</button><button class="btn" id="fOk">저장</button></div>`,()=>{
      bindChips($("#sheet"));
      const upd=()=>{const r=rankToGrade(+$("#fRk").value,+$("#fTo").value);$("#fAuto").textContent=r?`석차 기준 계산: ${r}등급 (상위 ${(+$("#fRk").value/+$("#fTo").value*100).toFixed(1)}%)`:"성적표의 등급을 고르거나, 석차와 수강자 수를 넣어 주세요.";};
      ["#fRk","#fTo"].forEach(s=>$(s).addEventListener("input",upd));upd();
      $("#fCancel").onclick=closeSheet;
      askDelete(()=>{S.grades=S.grades.filter(t=>t.id!==id);save();});
      $("#fOk").onclick=()=>{
        const manual=+$("#fGr").value;const auto=rankToGrade(+$("#fRk").value,+$("#fTo").value);
        const grade=manual||auto;
        if(!grade){toast("등급 또는 석차를 넣어 주세요");return;}
        const v={id:id||uid(),sem:chipVal("sem")||"1-1",subject:$("#fSub").value,credit:+$("#fCr").value||1,score:$("#fSc").value,achv:$("#fAc").value,rank:$("#fRk").value,total:$("#fTo").value,grade,auto:!manual};
        if(id)S.grades=S.grades.map(t=>t.id===id?v:t);else S.grades.push(v);
        gradeSem=v.sem;closeSheet();save();toast("저장했어요");
      };
    });
}
function actForm(id){
  const a=S.acts.find(t=>t.id===id)||{type:L("actTypes")[0],title:"",date:todayStr(),hours:"",memo:""};
  openSheet(`<h2>${id?"활동 수정":"활동 기록"}</h2>
    <label>종류</label>${chips(withCur(L("actTypes"),a.type),a.type,"type")}
    <div class="two"><div><label>날짜</label><input type="date" id="fDate" value="${a.date}"></div>
    <div><label>봉사 시간 (봉사만)</label><input type="number" inputmode="decimal" id="fHr" value="${a.hours}" placeholder="예: 2"></div></div>
    <label>무엇을 했나요?</label><input id="fTitle" value="${esc(a.title)}" placeholder="예: 과학동아리 – 수질 측정 실험">
    <label>느낀 점·배운 점</label><textarea id="fMemo" placeholder="내가 맡은 역할, 새로 알게 된 것, 더 해보고 싶은 것">${esc(a.memo)}</textarea>
    <div class="hint">생기부에는 '무엇을 했는지'보다 '어떤 역할을 했고 무엇을 배웠는지'가 중요해요.</div>
    <div class="btns">${delBtn(id)}<button class="btn ghost" id="fCancel">취소</button><button class="btn" id="fOk">저장</button></div>`,()=>{
      bindChips($("#sheet"));
      $("#fCancel").onclick=closeSheet;
      askDelete(()=>{S.acts=S.acts.filter(t=>t.id!==id);save();});
      $("#fOk").onclick=()=>{
        const title=$("#fTitle").value.trim();if(!title){toast("무엇을 했는지 적어 주세요");return;}
        const v={id:id||uid(),type:chipVal("type")||"기타",title,date:$("#fDate").value||todayStr(),hours:$("#fHr").value,memo:$("#fMemo").value.trim()};
        if(id)S.acts=S.acts.map(t=>t.id===id?v:t);else S.acts.push(v);
        closeSheet();save();toast("저장했어요");
      };
    });
}

/* ---------- events ---------- */
$("#nav").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;tab=b.dataset.tab;try{localStorage.setItem(KEY+"-tab",tab)}catch(e){}render();window.scrollTo(0,0);});
$("#fab").addEventListener("click",()=>tab==="tasks"?taskForm(null,taskView==="cal"?selDay:null):tab==="grades"?gradeForm():tab==="study"?(studySub==="voc"?deckForm():studyForm()):actForm());
$("#gear").addEventListener("click",()=>{tab=tab==="more"?"home":"more";render();window.scrollTo(0,0);});
$("#view").addEventListener("click",e=>{
  const cl=e.target.closest("[data-cal]");
  if(cl){const t=S.tasks.find(x=>x.id===cl.dataset.cal);if(t&&!t.cal){t.cal=1;save();}return;}
  const pl=e.target.closest("[data-plus]");if(pl){e.stopPropagation();const k=weekStart()+"|"+pl.dataset.plus;S.weekProg[k]=(S.weekProg[k]||0)+1;save();const gg=S.goals.weekly.find(x=>x.id===pl.dataset.plus);if(gg&&goalProg(gg)===gg.target)toast("목표 달성! 🎉 정말 대단해요");return;}
  const gl=e.target.closest("[data-goal]");if(gl)return weeklyForm(gl.dataset.goal);
  const ac=e.target.closest("[data-act]");if(ac){const a=ac.dataset.act;
    if(a==="career")return careerForm(); if(a==="goal-add")return weeklyForm(); if(a==="review-all")return review(null);
    if(a==="go-voc"){tab="study";studySub="voc";render();return;} if(a==="grade-goal")return gradeGoalForm();}
  const go=e.target.closest("[data-go]");if(go){tab=go.dataset.go;render();window.scrollTo(0,0);return;}
  const rv=e.target.closest("[data-review]");if(rv)return review(rv.dataset.review);
  const qz=e.target.closest("[data-quiz]");if(qz)return quiz(qz.dataset.quiz);
  const wd=e.target.closest("[data-words]");if(wd)return wordsSheet(wd.dataset.words);
  const dk=e.target.closest("[data-deck]");if(dk)return wordsSheet(dk.dataset.deck);
  const vw=e.target.closest("[data-view]");if(vw){taskView=vw.dataset.view;try{localStorage.setItem(KEY+"-view",taskView)}catch(_){}render();return;}
  const mn=e.target.closest("[data-mnav]");if(mn){const [y,m]=calMonth.split("-").map(Number);const d=new Date(y,m-1+Number(mn.dataset.mnav),1);calMonth=ymd(d).slice(0,7);selDay=calMonth===todayStr().slice(0,7)?todayStr():calMonth+"-01";render();return;}
  const dy=e.target.closest("[data-day]");if(dy){selDay=dy.dataset.day;if(selDay.slice(0,7)!==calMonth)calMonth=selDay.slice(0,7);render();return;}
  const ad=e.target.closest("[data-addon]");if(ad)return taskForm(null,ad.dataset.addon);
  const tg=e.target.closest("[data-toggle]");
  if(tg){e.stopPropagation();const t=S.tasks.find(x=>x.id===tg.dataset.toggle);t.done=!t.done;t.doneAt=t.done?todayStr():"";save();toast(t.done?"잘했어요! 완료 처리했어요":"다시 할 일로 옮겼어요");return;}
  const lg=e.target.closest("[data-log]");if(lg){e.stopPropagation();return logForm(lg.dataset.log);}
  const seg=e.target.closest("[data-seg] button");if(seg){if(seg.parentElement.dataset.seg==="sub"){studySub=seg.dataset.v;try{localStorage.setItem(KEY+"-sub",studySub)}catch(_){}}else if(seg.parentElement.dataset.seg==="study")studyFilter=seg.dataset.v;else taskFilter=seg.dataset.v;render();return;}
  const ch=e.target.closest("[data-chips] button");
  if(ch){const n=ch.parentElement.dataset.chips;if(n==="sem")gradeSem=ch.dataset.v;if(n==="act")actFilter=ch.dataset.v;render();return;}
  const et=e.target.closest("[data-edit-task]");if(et)return taskForm(et.dataset.editTask);
  const eg=e.target.closest("[data-edit-grade]");if(eg)return gradeForm(eg.dataset.editGrade);
  const ea=e.target.closest("[data-edit-act]");if(ea)return actForm(ea.dataset.editAct);
  const es=e.target.closest("[data-edit-study]");if(es)return studyForm(es.dataset.editStudy);
});
function bindMore(){
  document.querySelectorAll("[data-list]").forEach(b=>b.onclick=()=>listEditor(b.dataset.list));
  const sa=$("#saOn"),st=$("#saTime");
  const upd=()=>{S.studyAlarm={on:sa.checked,time:st.value||"21:00"};save();toast(sa.checked?`매일 ${S.studyAlarm.time}에 알려줄게요`:"선행 알림을 껐어요");};
  if(sa){sa.onchange=upd;st.onchange=upd;}
  const ap=$("#aPerm");if(ap)ap.onclick=async()=>{try{const s=await LN.requestPermissions();alarmPerm=s.display;if(s.display!=="granted")toast("폰 설정 → 애플리케이션 → 나의 고교생활 → 알림에서 켜 주세요");scheduleAll();}catch(e){}render();};
  const ax=$("#aExact");if(ax)ax.onclick=async()=>{try{const x=await LN.changeExactNotificationSetting();exactPerm=x.exact_alarm;scheduleAll();}catch(e){}render();};
  const at=$("#aTest");if(at)at.onclick=async()=>{try{await LN.schedule({notifications:[{id:999999999,channelId:"due",title:"테스트 알림",body:"알람이 잘 오네요! 👍",schedule:{at:new Date(Date.now()+5000),allowWhileIdle:true}}]});toast("5초 뒤에 알림이 와요");}catch(e){toast("알림을 보낼 수 없어요. 권한을 확인해 주세요");}};
  $("#nm").addEventListener("change",e=>{S.name=e.target.value.trim();save();toast("이름을 저장했어요");});
  $("#bk").addEventListener("click",async()=>{
    const txt=JSON.stringify(S);const ta=$("#bkTxt");ta.value=txt;ta.style.display="block";
    try{await navigator.clipboard.writeText(txt);toast("복사했어요. 안전한 곳에 붙여넣으세요");}
    catch(e){ta.select();toast("아래 내용을 길게 눌러 복사하세요");}
  });
  $("#rs").addEventListener("click",()=>{
    try{const d=JSON.parse($("#rsTxt").value);if(!d||!Array.isArray(d.tasks))throw 0;
      S=Object.assign(BLANK(),d);normalize();save();toast("복원했어요");}
    catch(e){toast("백업 내용이 올바르지 않아요");}
  });
}

loadLocal();
try{const t=localStorage.getItem(KEY+"-tab");if(t)tab=t;const v=localStorage.getItem(KEY+"-view");if(v)taskView=v;const sb=localStorage.getItem(KEY+"-sub");if(sb)studySub=sb;}catch(e){}
render();
if(APP){initAlarms();document.addEventListener("resume",()=>{render();initAlarms();});document.addEventListener("visibilitychange",()=>{if(!document.hidden){render();initAlarms();}});}
else initCloud();
</script>
</body>
</html>
