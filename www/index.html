<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>나의 고등학교 생활</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fbf8f4; --card:#ffffff; --ink:#2b2a33; --sub:#7a7684; --line:#ece6de;
  --main:#6c5ce7; --mainSoft:#efecff; --warn:#e8590c; --warnSoft:#fff1e6; --ok:#2f9e44; --okSoft:#e9f7ec;
  --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;font-size:15px}
header{padding:calc(env(safe-area-inset-top) + 18px) 20px 6px}
header h1{margin:0;font-size:22px;font-weight:700}
header p{margin:4px 0 0;color:var(--sub);font-size:13px}
main{padding:10px 16px calc(env(safe-area-inset-bottom) + 96px);max-width:560px;margin:0 auto}
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;padding:6px 6px calc(env(safe-area-inset-bottom) + 6px);z-index:5}
nav button{flex:1;border:0;background:none;padding:8px 0;font:inherit;font-size:12px;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:3px;border-radius:12px}
nav button svg{width:22px;height:22px}
nav button.on{color:var(--main);background:var(--mainSoft);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.sec{font-size:13px;color:var(--sub);margin:18px 4px 8px;font-weight:500}
.dday{min-width:58px;text-align:center;font-weight:700;font-size:15px;padding:6px 8px;border-radius:10px;background:var(--mainSoft);color:var(--main)}
.dday.hot{background:var(--warnSoft);color:var(--warn)}
.dday.past{background:#f1f1f3;color:var(--sub)}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;background:#f3f0ea;color:#6b6358;margin-right:4px}
.title{font-weight:500;overflow:hidden;text-overflow:ellipsis}
.meta{font-size:12px;color:var(--sub);margin-top:3px}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid #cfc8bf;background:#fff;flex:none;display:grid;place-items:center;padding:0}
.chk.done{background:var(--ok);border-color:var(--ok)}
.chk.done::after{content:"";width:8px;height:13px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.done-t{text-decoration:line-through;color:var(--sub)}
.fab{position:fixed;right:20px;bottom:calc(env(safe-area-inset-bottom) + 82px);width:56px;height:56px;border-radius:50%;border:0;background:var(--main);color:#fff;font-size:30px;box-shadow:0 6px 18px rgba(108,92,231,.35);z-index:6}
.empty{text-align:center;color:var(--sub);padding:30px 10px;font-size:14px;line-height:1.6}
.seg{display:flex;background:#f1ece5;border-radius:12px;padding:3px;margin-bottom:10px}
.seg button{flex:1;border:0;background:none;padding:8px;font:inherit;font-size:13px;border-radius:10px;color:var(--sub)}
.seg button.on{background:#fff;color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.big{font-size:30px;font-weight:700;color:var(--main)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.stats .card{margin:0}
.bar{height:8px;background:#f1ece5;border-radius:99px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--main);border-radius:99px}
.grade{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-weight:700;flex:none}
.g1{background:#e7f5ff;color:#1c7ed6}.g2{background:#e6fcf5;color:#0ca678}.g3{background:#fff9db;color:#e67700}.g4{background:#fff0f6;color:#d6336c}.g5{background:#f1f3f5;color:#495057}
.del{border:0;background:none;color:#b8b1a8;font-size:20px;padding:4px 6px}
/* sheet */
.dim{position:fixed;inset:0;background:rgba(30,25,40,.38);z-index:10;display:none;align-items:flex-end;justify-content:center}
.dim.show{display:flex}
.sheet{background:#fff;width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:20px 18px calc(env(safe-area-inset-bottom) + 18px);max-height:88vh;overflow:auto;animation:up .2s ease}
@keyframes up{from{transform:translateY(40px);opacity:.5}}
.sheet h2{margin:0 0 14px;font-size:18px}
label{display:block;font-size:13px;color:var(--sub);margin:12px 0 5px}
input,select,textarea{width:100%;font:inherit;font-size:16px;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:#fdfcfa;color:var(--ink)}
textarea{min-height:80px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--mainSoft);border-color:var(--main)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btns{display:flex;gap:8px;margin-top:18px}
.btn{flex:1;border:0;border-radius:12px;padding:13px;font:inherit;font-weight:700;background:var(--main);color:#fff}
.btn.ghost{background:#f1ece5;color:var(--ink)}
.btn.red{background:#fff0f0;color:#e03131}
.hint{font-size:12px;color:var(--sub);margin-top:6px;line-height:1.5}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 12px;font:inherit;font-size:13px;color:var(--ink)}
.chips button.on{background:var(--main);border-color:var(--main);color:#fff}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 92px);transform:translateX(-50%);background:#2b2a33;color:#fff;padding:10px 16px;border-radius:99px;font-size:13px;opacity:0;transition:.25s;z-index:20;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
.sync{font-size:12px;color:var(--sub)}
.calbtn{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--sub);background:#f6f2ec}
.calbtn.on{color:var(--ok);background:var(--okSoft)}
.steps{margin:8px 0 0;padding-left:18px;font-size:13px;line-height:1.7;color:#5a5664}
</style>
</head>
<body>
<header>
  <h1 id="hello">나의 고등학교 생활</h1>
  <p id="today"></p>
</header>
<main id="view"></main>
<button class="fab" id="fab" aria-label="추가">+</button>
<nav id="nav">
  <button data-tab="tasks" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>일정</button>
  <button data-tab="grades"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>성적</button>
  <button data-tab="acts"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.4 6.8 19.1l1-5.8L3.5 9.2l5.9-.9z"/></svg>활동</button>
  <button data-tab="more"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>설정</button>
</nav>
<div class="dim" id="dim"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
const SUBJECTS=["국어","수학","영어","한국사","통합사회","통합과학","과학탐구실험","정보","체육","음악","미술","기술·가정","제2외국어","기타"];
const TASK_TYPES=["수행평가","지필고사","과제","준비물","기타"];
const ACT_TYPES=["동아리","봉사","독서","탐구·발표","대회·수상","진로","기타"];
const SEMS=["1-1","1-2","2-1","2-2","3-1","3-2"];
const KEY="hs-life-v1";

let S={name:"",tasks:[],grades:[],acts:[],updatedAt:0};
let tab="tasks", taskFilter="todo", gradeSem="all", actFilter="all";
let cloud=null, syncState="이 폰에만 저장 중";
/* ---------- 안드로이드 앱(Capacitor) 알람 ---------- */
const APP=!!(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform());
const LN=APP&&Capacitor.Plugins?Capacitor.Plugins.LocalNotifications:null;
let alarmPerm="unknown", exactPerm="unknown";
function hashId(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))|0;return Math.abs(h)%400000000;}
let schedTimer=null;
function scheduleSoon(){if(!LN)return;clearTimeout(schedTimer);schedTimer=setTimeout(scheduleAll,500);}
async function scheduleAll(){
  if(!LN)return;
  try{
    const p=await LN.getPending();
    if(p.notifications&&p.notifications.length)await LN.cancel({notifications:p.notifications.map(n=>({id:n.id}))});
    const now=Date.now(),list=[];
    S.tasks.filter(t=>!t.done).forEach(t=>{
      const base=hashId(t.id)*2;
      const eve=new Date(t.date+"T20:00:00");eve.setDate(eve.getDate()-1);
      const morn=new Date(t.date+"T07:00:00");
      if(eve.getTime()>now)list.push({id:base,channelId:"due",title:"내일 마감 · "+t.title,body:`${t.subject} ${t.type} — 오늘 밤에 한 번 더 확인해요`,schedule:{at:eve,allowWhileIdle:true}});
      if(morn.getTime()>now)list.push({id:base+1,channelId:"due",title:"오늘 마감 · "+t.title,body:`${t.subject} ${t.type} — 잊지 말고 챙기기!`,schedule:{at:morn,allowWhileIdle:true}});
    });
    if(list.length)await LN.schedule({notifications:list});
  }catch(e){console.log("schedule error",e);}
}
async function initAlarms(){
  if(!LN)return;
  try{await LN.createChannel({id:"due",name:"마감 알림",description:"수행평가·시험 마감 알림",importance:5,visibility:1,vibration:true});}catch(e){}
  try{let s=await LN.checkPermissions();if(s.display!=="granted")s=await LN.requestPermissions();alarmPerm=s.display;}catch(e){}
  try{const x=await LN.checkExactNotificationSetting();exactPerm=x.exact_alarm;}catch(e){}
  scheduleAll();if(tab==="more")render();
}

/* ---------- storage ---------- */
function loadLocal(){try{const t=localStorage.getItem(KEY);if(t){const d=JSON.parse(t);if(d&&d.tasks)S=Object.assign(S,d);}}catch(e){}}
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
let pushTimer=null;
function save(){S.updatedAt=Date.now();saveLocal();scheduleSoon();if(cloud){clearTimeout(pushTimer);pushTimer=setTimeout(pushCloud,800);}render();}
async function pushCloud(){try{await cloud.set(JSON.parse(JSON.stringify(S)));syncState="계정에 자동 저장됨";}catch(e){syncState="계정 저장 실패 · 폰에는 저장됨";}if(tab==="more")render();}
async function initCloud(){
  try{
    if(!window.claude||!claude.use)return;
    const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
    if(!db||!user)return;
    const id=await user.id(); if(!id)return;
    const ref=db.collection("data/users/"+id).doc("state");
    let snap=null;
    await Promise.race([ref.get().then(s=>snap=s),new Promise(r=>setTimeout(r,10000))]);
    let remote=null;
    if(snap){remote=typeof snap.data==="function"?snap.data():(snap.data!==undefined?snap.data:snap);}
    cloud=ref;
    if(remote&&remote.tasks&&(remote.updatedAt||0)>(S.updatedAt||0)){S=Object.assign({name:"",tasks:[],grades:[],acts:[]},remote);saveLocal();}
    else if(S.updatedAt){await pushCloud();}
    syncState="계정에 자동 저장됨";render();
  }catch(e){}
}

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function todayStr(){const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10);}
function ddays(date){const a=new Date(todayStr()+"T00:00:00"),b=new Date(date+"T00:00:00");return Math.round((b-a)/86400000);}
function ddayLabel(n){return n===0?"D-day":n>0?"D-"+n:"D+"+(-n);}
function fmtDate(s){if(!s)return"";const d=new Date(s+"T00:00:00");return (d.getMonth()+1)+"월 "+d.getDate()+"일 ("+"일월화수목금토"[d.getDay()]+")";}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),1800);}
function chips(list,cur,name){return `<div class="chips" data-chips="${name}">${list.map(v=>`<button type="button" class="${v===cur?"on":""}" data-v="${esc(v)}">${esc(v)}</button>`).join("")}</div>`;}
function subjOptions(cur){return SUBJECTS.map(s=>`<option ${s===cur?"selected":""}>${s}</option>`).join("");}
/* 5등급 상대평가: 누적 10/34/66/90/100% */
function rankToGrade(rank,total){if(!rank||!total)return null;const p=rank/total*100;return p<=10?1:p<=34?2:p<=66?3:p<=90?4:5;}
/* 구글 캘린더 종일 일정 링크 */
function gcalUrl(x){
  const d=x.date.replace(/-/g,"");const n=new Date(x.date+"T00:00:00");n.setDate(n.getDate()+1);
  const e=n.getFullYear()+String(n.getMonth()+1).padStart(2,"0")+String(n.getDate()).padStart(2,"0");
  const p=new URLSearchParams({action:"TEMPLATE",text:`[${x.subject} ${x.type}] ${x.title}`,dates:`${d}/${e}`,details:(x.memo?x.memo+"\n\n":"")+"나의 고등학교 생활 앱에서 추가한 일정"});
  return "https://calendar.google.com/calendar/render?"+p.toString();
}
const CAL_SVG=`<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4M12 13v5M9.5 15.5h5"/></svg>`;
function calSheet(x){
  openSheet(`<h2>알람도 받을까요?</h2>
    <div class="card" style="background:var(--mainSoft);border:0"><div class="title">${esc(x.title)}</div><div class="meta">${esc(x.subject)} · ${esc(x.type)} · ${fmtDate(x.date)}</div></div>
    <div class="hint">아래 버튼을 누르면 구글 캘린더가 열려요. <b>저장</b>을 누르면 폰 캘린더에 들어가고, 정해둔 시간에 알람이 와요.</div>
    <div class="btns"><button class="btn ghost" id="cNo">괜찮아요</button><a class="btn" style="text-align:center;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:6px" href="${gcalUrl(x)}" target="_blank" rel="noopener" id="cGo">${CAL_SVG}캘린더에 추가</a></div>`,()=>{
      $("#cNo").onclick=closeSheet;$("#cGo").addEventListener("click",()=>{const t=S.tasks.find(k=>k.id===x.id);if(t){t.cal=1;save();}setTimeout(closeSheet,300);});
    });
}
function avgGrade(list){let w=0,s=0;list.forEach(g=>{if(g.grade){const c=Number(g.credit)||1;w+=c;s+=c*g.grade;}});return w?s/w:null;}

/* ---------- views ---------- */
function vTasks(){
  const t=S.tasks.slice();
  const todo=t.filter(x=>!x.done).sort((a,b)=>a.date.localeCompare(b.date));
  const done=t.filter(x=>x.done).sort((a,b)=>b.date.localeCompare(a.date));
  const list=taskFilter==="todo"?todo:done;
  const week=todo.filter(x=>{const n=ddays(x.date);return n>=0&&n<=7;}).length;
  const over=todo.filter(x=>ddays(x.date)<0).length;
  let h=`<div class="stats">
    <div class="card"><div class="meta">이번 주 마감</div><div class="big">${week}<span style="font-size:15px;color:var(--sub)"> 개</span></div></div>
    <div class="card"><div class="meta">${over?"마감 지남":"남은 할 일"}</div><div class="big" style="color:${over?"var(--warn)":"var(--main)"}">${over||todo.length}<span style="font-size:15px;color:var(--sub)"> 개</span></div></div>
  </div>
  <div class="seg" data-seg="task"><button class="${taskFilter==="todo"?"on":""}" data-v="todo">해야 할 일 ${todo.length}</button><button class="${taskFilter==="done"?"on":""}" data-v="done">끝낸 일 ${done.length}</button></div>`;
  if(!list.length) h+=`<div class="empty">${taskFilter==="todo"?"등록된 일정이 없어요.<br>수행평가나 시험이 공지되면<br>아래 <b>+</b> 버튼으로 추가해 보세요.":"아직 끝낸 일이 없어요."}</div>`;
  list.forEach(x=>{
    const n=ddays(x.date);
    const cls=x.done?"past":n<0?"hot":n<=3?"hot":"";
    h+=`<div class="card row" data-edit-task="${x.id}">
      <button class="chk ${x.done?"done":""}" data-toggle="${x.id}" aria-label="완료"></button>
      <div class="grow">
        <div class="title ${x.done?"done-t":""}">${esc(x.title)}</div>
        <div class="meta"><span class="tag">${esc(x.subject)}</span><span class="tag">${esc(x.type)}</span>${fmtDate(x.date)}</div>
      </div>
      ${x.done||APP?"":`<a class="calbtn ${x.cal?"on":""}" href="${gcalUrl(x)}" target="_blank" rel="noopener" data-cal="${x.id}" aria-label="캘린더에 추가">${CAL_SVG}</a>`}
      <div class="dday ${cls}">${x.done?"완료":ddayLabel(n)}</div>
    </div>`;
  });
  return h;
}
function vGrades(){
  const sems=SEMS.filter(s=>S.grades.some(g=>g.sem===s));
  const list=S.grades.filter(g=>gradeSem==="all"||g.sem===gradeSem);
  const total=avgGrade(S.grades);
  let h=`<div class="card"><div class="meta">${gradeSem==="all"?"전체":gradeSem.replace("-","학년 ")+"학기"} 평균 등급 (학점 가중)</div>
    <div class="row"><div class="big">${(gradeSem==="all"?total:avgGrade(list))?.toFixed(2)??"-"}</div><div class="grow"></div><div class="meta">5등급제 기준</div></div></div>`;
  if(sems.length>1){
    h+=`<div class="card"><div class="meta" style="margin-bottom:4px">학기별 변화 (막대가 길수록 좋은 성적)</div>`;
    sems.forEach(s=>{const a=avgGrade(S.grades.filter(g=>g.sem===s));const pct=a?Math.max(4,(5-a)/4*100):0;
      h+=`<div style="margin-top:10px"><div class="row"><span class="grow" style="font-size:13px">${s.replace("-","학년 ")}학기</span><b>${a?a.toFixed(2):"-"}</b></div><div class="bar"><i style="width:${pct}%"></i></div></div>`;});
    h+=`</div>`;
  }
  h+=`<div class="sec">학기 선택</div>`+chips(["all",...SEMS],gradeSem,"sem").replace(/>all</,">전체<");
  h+=`<div class="sec">과목별 성적</div>`;
  if(!list.length) h+=`<div class="empty">아직 입력한 성적이 없어요.<br>시험이 끝나면 <b>+</b> 버튼으로<br>과목별 성적을 넣어 보세요.</div>`;
  list.slice().sort((a,b)=>a.sem.localeCompare(b.sem)||a.subject.localeCompare(b.subject)).forEach(g=>{
    h+=`<div class="card row" data-edit-grade="${g.id}">
      <div class="grade g${g.grade||5}">${g.grade||"-"}</div>
      <div class="grow"><div class="title">${esc(g.subject)}${g.achv?` <span class="tag">성취도 ${esc(g.achv)}</span>`:""}</div>
      <div class="meta">${g.sem.replace("-","학년 ")}학기 · ${g.credit}학점${g.score?` · ${g.score}점`:""}${g.rank?` · ${g.rank}/${g.total}등`:""}</div></div>
    </div>`;
  });
  return h;
}
function vActs(){
  const list=S.acts.filter(a=>actFilter==="all"||a.type===actFilter).sort((a,b)=>b.date.localeCompare(a.date));
  const counts={};S.acts.forEach(a=>counts[a.type]=(counts[a.type]||0)+1);
  const hours=S.acts.filter(a=>a.type==="봉사").reduce((s,a)=>s+(Number(a.hours)||0),0);
  let h=`<div class="stats">
    <div class="card"><div class="meta">기록한 활동</div><div class="big">${S.acts.length}<span style="font-size:15px;color:var(--sub)"> 개</span></div></div>
    <div class="card"><div class="meta">봉사 시간</div><div class="big">${hours}<span style="font-size:15px;color:var(--sub)"> 시간</span></div></div>
  </div>`;
  h+=chips(["all",...ACT_TYPES],actFilter,"act").replace(/>all</,">전체<");
  h+=`<div style="height:10px"></div>`;
  if(!list.length) h+=`<div class="empty">동아리, 봉사, 책 읽은 것, 발표한 것…<br>하고 나서 바로 한두 줄 남겨두면<br>3학년 때 정말 큰 도움이 돼요.</div>`;
  list.forEach(a=>{
    h+=`<div class="card" data-edit-act="${a.id}">
      <div class="row"><span class="tag">${esc(a.type)}</span>${a.type==="봉사"&&a.hours?`<span class="tag">${a.hours}시간</span>`:""}<div class="grow"></div><span class="meta" style="margin:0">${fmtDate(a.date)}</span></div>
      <div class="title" style="margin-top:8px">${esc(a.title)}</div>
      ${a.memo?`<div class="meta" style="font-size:13px;line-height:1.6;white-space:pre-wrap;color:#5a5664">${esc(a.memo)}</div>`:""}
    </div>`;
  });
  return h;
}
function vMore(){
  const appAlarm=`<div class="card"><div class="title">마감 알람</div>
    <div class="hint">끝내지 않은 일정은 <b>마감 전날 밤 8시</b>와 <b>당일 아침 7시</b>에 자동으로 알려줘요. 완료 체크하면 알람도 사라져요.</div>
    <div class="sync" style="margin-top:8px">알림 권한: ${alarmPerm==="granted"?"✅ 켜짐":"⚠️ 꺼짐 — 아래 버튼을 눌러 허용해 주세요"}</div>
    ${exactPerm!=="granted"&&exactPerm!=="unknown"?`<div class="sync">정확한 시간 알림: ⚠️ 꺼짐 (알람이 몇 분 늦게 올 수 있어요)</div>`:""}
    <div class="btns">${alarmPerm!=="granted"?`<button class="btn" id="aPerm">알림 허용</button>`:""}${exactPerm!=="granted"&&exactPerm!=="unknown"?`<button class="btn ghost" id="aExact">정확한 시간 켜기</button>`:""}<button class="btn ghost" id="aTest">테스트 알림</button></div></div>`;
  return `<div class="card"><label style="margin-top:0">내 이름 (첫 화면 인사에 나와요)</label>
    <input id="nm" value="${esc(S.name)}" placeholder="예: 지윤"></div>
  ${APP?appAlarm:`<div class="card"><div class="title">알람 받는 법 (처음 한 번만)</div>
    <div class="hint">일정을 저장할 때 <b>캘린더에 추가</b>를 누르면 구글 캘린더에 들어가요. 알람 시간은 구글 캘린더에서 한 번만 정해두면 돼요.</div>
    <ol class="steps"><li>구글 캘린더 앱 → 왼쪽 위 ☰ → <b>설정</b></li><li>내 계정 선택 → <b>종일 일정</b>의 <b>기본 알림</b></li><li><b>1일 전 오후 8시</b>처럼 원하는 시간 선택</li></ol>
    <div class="hint">삼성 캘린더에 같은 구글 계정이 연결돼 있으면 삼성 캘린더에도 똑같이 보여요. 일정 옆 캘린더 아이콘이 초록색이면 이미 추가한 일정이에요.</div></div>`}
  <div class="card"><div class="title">저장 상태</div><div class="sync" style="margin-top:4px">${syncState}</div>
    <div class="hint">${APP?"폰을 바꾸거나 앱을 지우기 전에는":"폰을 바꾸거나 브라우저 기록을 지우기 전에는"} 아래 백업을 꼭 해 두세요. 웹 버전에서 백업한 내용도 여기서 복원할 수 있어요.</div></div>
  <div class="card"><div class="title">백업하기</div>
    <div class="hint">버튼을 누르면 백업 내용이 복사돼요. 카톡 나에게 보내기나 메모장에 붙여넣어 보관하세요.</div>
    <div class="btns"><button class="btn" id="bk">백업 내용 복사</button></div>
    <textarea id="bkTxt" readonly style="margin-top:10px;display:none;font-size:12px"></textarea></div>
  <div class="card"><div class="title">복원하기</div>
    <div class="hint">보관해 둔 백업 내용을 붙여넣고 복원을 누르세요. 지금 내용은 백업 내용으로 바뀌어요.</div>
    <textarea id="rsTxt" placeholder="여기에 백업 내용 붙여넣기" style="margin-top:10px;font-size:12px"></textarea>
    <div class="btns"><button class="btn ghost" id="rs">복원</button></div></div>
  <div class="card"><div class="title">내신 등급 기준 (5등급 상대평가)</div>
    <div class="hint">1등급 상위 10% · 2등급 34% · 3등급 66% · 4등급 90% · 5등급 100%<br>석차와 수강자 수를 넣으면 등급이 자동으로 계산돼요. 학교 성적표에 나온 등급이 있으면 그걸 우선으로 써 주세요.</div></div>`;
}

function render(){
  const d=new Date();
  $("#hello").textContent=S.name?`${S.name}의 고등학교 생활`:"나의 고등학교 생활";
  $("#today").textContent=`${d.getMonth()+1}월 ${d.getDate()}일 ${"일월화수목금토"[d.getDay()]}요일`;
  $("#view").innerHTML=tab==="tasks"?vTasks():tab==="grades"?vGrades():tab==="acts"?vActs():vMore();
  $("#fab").style.display=tab==="more"?"none":"block";
  document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.tab===tab));
  if(tab==="more")bindMore();
}

/* ---------- sheets (forms) ---------- */
function openSheet(html,onBind){$("#sheet").innerHTML=html;$("#dim").classList.add("show");onBind&&onBind();}
function closeSheet(){$("#dim").classList.remove("show");}
$("#dim").addEventListener("click",e=>{if(e.target.id==="dim")closeSheet();});
function bindChips(root){root.querySelectorAll("[data-chips]").forEach(c=>c.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;c.querySelectorAll("button").forEach(x=>x.classList.remove("on"));b.classList.add("on");c.dataset.val=b.dataset.v;}));}
function chipVal(name){const c=$(`#sheet [data-chips="${name}"]`);const on=c&&c.querySelector(".on");return on?on.dataset.v:"";}
function delBtn(has){return has?`<button class="btn red" id="fDel">삭제</button>`:"";}
function askDelete(fn){const b=$("#fDel");if(!b)return;b.addEventListener("click",()=>{if(b.dataset.sure){fn();closeSheet();toast("삭제했어요");}else{b.dataset.sure=1;b.textContent="한 번 더 누르면 삭제";}});}

function taskForm(id){
  const x=S.tasks.find(t=>t.id===id)||{subject:"국어",type:"수행평가",title:"",date:todayStr(),memo:""};
  openSheet(`<h2>${id?"일정 수정":"새 일정"}</h2>
    <label>종류</label>${chips(TASK_TYPES,x.type,"type")}
    <div class="two"><div><label>과목</label><select id="fSub">${subjOptions(x.subject)}</select></div>
    <div><label>마감일</label><input type="date" id="fDate" value="${x.date}"></div></div>
    <label>내용</label><input id="fTitle" value="${esc(x.title)}" placeholder="예: 독서 감상문 제출">
    <label>메모 (선택)</label><textarea id="fMemo" placeholder="준비할 것, 평가 기준 등">${esc(x.memo)}</textarea>
    <div class="btns">${delBtn(id)}<button class="btn ghost" id="fCancel">취소</button><button class="btn" id="fOk">저장</button></div>`,()=>{
      bindChips($("#sheet"));
      $("#fCancel").onclick=closeSheet;
      askDelete(()=>{S.tasks=S.tasks.filter(t=>t.id!==id);save();});
      $("#fOk").onclick=()=>{
        const title=$("#fTitle").value.trim();const date=$("#fDate").value;
        if(!title){toast("내용을 적어 주세요");return;} if(!date){toast("마감일을 골라 주세요");return;}
        const v={id:id||uid(),subject:$("#fSub").value,type:chipVal("type")||"기타",title,date,memo:$("#fMemo").value.trim(),done:x.done||false};
        const changed=id&&(x.date!==v.date||x.title!==v.title);
        if(id){v.cal=changed?0:(x.cal||0);S.tasks=S.tasks.map(t=>t.id===id?v:t);}else S.tasks.push(v);
        save();
        if(!APP&&(!id||changed))calSheet(v);else{closeSheet();toast(APP?"저장했어요 · 전날 밤 8시, 당일 아침 7시에 알려줄게요":"저장했어요");}
      };
    });
}
function gradeForm(id){
  const last=S.grades[S.grades.length-1];
  const g=S.grades.find(t=>t.id===id)||{sem:last?last.sem:"1-1",subject:"국어",credit:4,score:"",rank:"",total:"",grade:"",achv:""};
  openSheet(`<h2>${id?"성적 수정":"성적 입력"}</h2>
    <label>학기</label>${chips(SEMS,g.sem,"sem")}
    <div class="two"><div><label>과목</label><select id="fSub">${subjOptions(g.subject)}</select></div>
    <div><label>학점(단위)</label><input type="number" inputmode="numeric" id="fCr" value="${g.credit}"></div></div>
    <div class="two"><div><label>원점수 (선택)</label><input type="number" inputmode="decimal" id="fSc" value="${g.score}" placeholder="예: 87"></div>
    <div><label>성취도 (선택)</label><select id="fAc"><option value="">-</option>${["A","B","C","D","E"].map(a=>`<option ${a===g.achv?"selected":""}>${a}</option>`).join("")}</select></div></div>
    <div class="two"><div><label>석차</label><input type="number" inputmode="numeric" id="fRk" value="${g.rank}" placeholder="예: 25"></div>
    <div><label>수강자 수</label><input type="number" inputmode="numeric" id="fTo" value="${g.total}" placeholder="예: 230"></div></div>
    <label>등급</label><select id="fGr"><option value="">석차로 자동 계산</option>${[1,2,3,4,5].map(n=>`<option value="${n}" ${n==g.grade&&!g.auto?"selected":""}>${n}등급</option>`).join("")}</select>
    <div class="hint" id="fAuto"></div>
    <div class="btns">${delBtn(id)}<button class="btn ghost" id="fCancel">취소</button><button class="btn" id="fOk">저장</button></div>`,()=>{
      bindChips($("#sheet"));
      const upd=()=>{const r=rankToGrade(+$("#fRk").value,+$("#fTo").value);$("#fAuto").textContent=r?`석차 기준 계산: ${r}등급 (상위 ${(+$("#fRk").value/+$("#fTo").value*100).toFixed(1)}%)`:"성적표의 등급을 고르거나, 석차와 수강자 수를 넣어 주세요.";};
      ["#fRk","#fTo"].forEach(s=>$(s).addEventListener("input",upd));upd();
      $("#fCancel").onclick=closeSheet;
      askDelete(()=>{S.grades=S.grades.filter(t=>t.id!==id);save();});
      $("#fOk").onclick=()=>{
        const manual=+$("#fGr").value;const auto=rankToGrade(+$("#fRk").value,+$("#fTo").value);
        const grade=manual||auto;
        if(!grade){toast("등급 또는 석차를 넣어 주세요");return;}
        const v={id:id||uid(),sem:chipVal("sem")||"1-1",subject:$("#fSub").value,credit:+$("#fCr").value||1,score:$("#fSc").value,achv:$("#fAc").value,rank:$("#fRk").value,total:$("#fTo").value,grade,auto:!manual};
        if(id)S.grades=S.grades.map(t=>t.id===id?v:t);else S.grades.push(v);
        gradeSem=v.sem;closeSheet();save();toast("저장했어요");
      };
    });
}
function actForm(id){
  const a=S.acts.find(t=>t.id===id)||{type:"동아리",title:"",date:todayStr(),hours:"",memo:""};
  openSheet(`<h2>${id?"활동 수정":"활동 기록"}</h2>
    <label>종류</label>${chips(ACT_TYPES,a.type,"type")}
    <div class="two"><div><label>날짜</label><input type="date" id="fDate" value="${a.date}"></div>
    <div><label>봉사 시간 (봉사만)</label><input type="number" inputmode="decimal" id="fHr" value="${a.hours}" placeholder="예: 2"></div></div>
    <label>무엇을 했나요?</label><input id="fTitle" value="${esc(a.title)}" placeholder="예: 과학동아리 – 수질 측정 실험">
    <label>느낀 점·배운 점</label><textarea id="fMemo" placeholder="내가 맡은 역할, 새로 알게 된 것, 더 해보고 싶은 것">${esc(a.memo)}</textarea>
    <div class="hint">생기부에는 '무엇을 했는지'보다 '어떤 역할을 했고 무엇을 배웠는지'가 중요해요.</div>
    <div class="btns">${delBtn(id)}<button class="btn ghost" id="fCancel">취소</button><button class="btn" id="fOk">저장</button></div>`,()=>{
      bindChips($("#sheet"));
      $("#fCancel").onclick=closeSheet;
      askDelete(()=>{S.acts=S.acts.filter(t=>t.id!==id);save();});
      $("#fOk").onclick=()=>{
        const title=$("#fTitle").value.trim();if(!title){toast("무엇을 했는지 적어 주세요");return;}
        const v={id:id||uid(),type:chipVal("type")||"기타",title,date:$("#fDate").value||todayStr(),hours:$("#fHr").value,memo:$("#fMemo").value.trim()};
        if(id)S.acts=S.acts.map(t=>t.id===id?v:t);else S.acts.push(v);
        closeSheet();save();toast("저장했어요");
      };
    });
}

/* ---------- events ---------- */
$("#nav").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;tab=b.dataset.tab;try{localStorage.setItem(KEY+"-tab",tab)}catch(e){}render();window.scrollTo(0,0);});
$("#fab").addEventListener("click",()=>tab==="tasks"?taskForm():tab==="grades"?gradeForm():actForm());
$("#view").addEventListener("click",e=>{
  const cl=e.target.closest("[data-cal]");
  if(cl){const t=S.tasks.find(x=>x.id===cl.dataset.cal);if(t&&!t.cal){t.cal=1;save();}return;}
  const tg=e.target.closest("[data-toggle]");
  if(tg){e.stopPropagation();const t=S.tasks.find(x=>x.id===tg.dataset.toggle);t.done=!t.done;save();toast(t.done?"잘했어요! 완료 처리했어요":"다시 할 일로 옮겼어요");return;}
  const seg=e.target.closest("[data-seg] button");if(seg){taskFilter=seg.dataset.v;render();return;}
  const ch=e.target.closest("[data-chips] button");
  if(ch){const n=ch.parentElement.dataset.chips;if(n==="sem")gradeSem=ch.dataset.v;if(n==="act")actFilter=ch.dataset.v;render();return;}
  const et=e.target.closest("[data-edit-task]");if(et)return taskForm(et.dataset.editTask);
  const eg=e.target.closest("[data-edit-grade]");if(eg)return gradeForm(eg.dataset.editGrade);
  const ea=e.target.closest("[data-edit-act]");if(ea)return actForm(ea.dataset.editAct);
});
function bindMore(){
  const ap=$("#aPerm");if(ap)ap.onclick=async()=>{try{const s=await LN.requestPermissions();alarmPerm=s.display;if(s.display!=="granted")toast("폰 설정 → 애플리케이션 → 나의 고교생활 → 알림에서 켜 주세요");scheduleAll();}catch(e){}render();};
  const ax=$("#aExact");if(ax)ax.onclick=async()=>{try{const x=await LN.changeExactNotificationSetting();exactPerm=x.exact_alarm;scheduleAll();}catch(e){}render();};
  const at=$("#aTest");if(at)at.onclick=async()=>{try{await LN.schedule({notifications:[{id:999999999,channelId:"due",title:"테스트 알림",body:"알람이 잘 오네요! 👍",schedule:{at:new Date(Date.now()+5000),allowWhileIdle:true}}]});toast("5초 뒤에 알림이 와요");}catch(e){toast("알림을 보낼 수 없어요. 권한을 확인해 주세요");}};
  $("#nm").addEventListener("change",e=>{S.name=e.target.value.trim();save();toast("이름을 저장했어요");});
  $("#bk").addEventListener("click",async()=>{
    const txt=JSON.stringify(S);const ta=$("#bkTxt");ta.value=txt;ta.style.display="block";
    try{await navigator.clipboard.writeText(txt);toast("복사했어요. 안전한 곳에 붙여넣으세요");}
    catch(e){ta.select();toast("아래 내용을 길게 눌러 복사하세요");}
  });
  $("#rs").addEventListener("click",()=>{
    try{const d=JSON.parse($("#rsTxt").value);if(!d||!Array.isArray(d.tasks))throw 0;
      S=Object.assign({name:"",tasks:[],grades:[],acts:[]},d);save();toast("복원했어요");}
    catch(e){toast("백업 내용이 올바르지 않아요");}
  });
}

loadLocal();
try{const t=localStorage.getItem(KEY+"-tab");if(t)tab=t;}catch(e){}
render();
if(APP){initAlarms();document.addEventListener("resume",()=>{render();initAlarms();});document.addEventListener("visibilitychange",()=>{if(!document.hidden){render();initAlarms();}});}
else initCloud();
</script>
</body>
</html>
