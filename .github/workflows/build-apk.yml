name: APK 빌드

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: 패키지 설치
        run: npm ci

      - name: 안드로이드 프로젝트 만들기 (아이콘·알림·서명 적용)
        run: node native/setup-android.mjs

      - name: APK 빌드
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../school-life.apk

      - name: 빌드 결과 보관
        uses: actions/upload-artifact@v4
        with:
          name: school-life-apk
          path: school-life.apk

      - name: Releases에 APK 올리기
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: 나의 고교생활 v1.0.${{ github.run_number }}
          body: |
            아래 school-life.apk 를 폰에서 내려받아 설치하세요.
            이전 버전이 깔려 있어도 그대로 덮어 설치하면 되고, 기록은 유지돼요.
          files: school-life.apk
          make_latest: true
